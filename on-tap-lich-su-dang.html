<script>
const DATA={"chapters": ["Chương mở đầu. ĐỐI TƯỢNG, CHỨC NĂNG, NHIỆM VỤ, NỘI DUNG VÀ PHƯƠNG PHÁP NGHIÊN CỨU, HỌC TẬP LỊCH ĐẢNG CỘNG SẢN VIỆT NAM", "Chương 1. ĐẢNG CỘNG SẢN VIỆT NAM RA ĐỜI VÀ LÃNH ĐẠO ĐẤU TRANH GIÀNH CHÍNH QUYỀN (1930-1945)", "Chương 2. ĐẢNG LÃNH ĐẠO HAI CUỘC KHÁNG CHIẾN HOÀN THÀNH GIẢI PHÓNG DÂN TỘC, THỐNG NHẤT ĐẤT NƯỚC (1945-1975)", "Chương 3. ĐẢNG LÃNH ĐẠO CẢ NƯỚC QUÁ ĐỘ LÊN CHỦ NGHĨA XÃ HỘI VÀ TIẾN HÀNH CÔNG CUỘC ĐỔI MỚI (TỪ 1975 ĐẾN NAY)"], "questions": [{"ch": 0, "num": 1, "q": "Điền từ còn thiếu vào chỗ trống: “Đảng Cộng sản Việt Nam là đội tiền phong của giai cấp công nhân, đồng thời là đội tiền phong của nhân dân lao động và của dân tộc Việt Nam, đại biểu trung thành lợi ích của giai cấp công nhân, nhân dân lao động và của dân tộc. Đảng lấy chủ nghĩa Mác - Lênin và Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động, lấy ……làm nguyên tắc tổ chức cơ bản” (Văn kiện Đại hội XI của Đảng)", "opts": ["Phê bình và tự phê bình", "Tập trung dân chủ", "Đoàn kết thống nhất trong Đảng", "Kỷ luật nghiêm minh, tự giác"], "ans": 1}, {"ch": 0, "num": 2, "q": "Đối tượng nghiên cứu của khoa học Lịch sử Đảng Cộng sản Việt Nam:", "opts": ["Các cán bộ, đảng viên Đảng Cộng sản Việt Nam", "Những mặt hạn chế trong quá trình lãnh đạo của Đảng", "Sự ra đời, phát triển và hoạt động lãnh đạo của Đảng qua các thời kỳ lịch sử", "Các văn kiện của Đảng chuẩn bị được lưu hành"], "ans": 2}, {"ch": 0, "num": 3, "q": "Là một ngành của khoa học lịch sử, Lịch sử Đảng Cộng sản Việt Nam có các chức năng, nhiệm vụ của khoa học lịch sử, đồng thời còn có thêm các chức năng nổi bật khác là:", "opts": ["Chức năng nhận thức, điều tiết, chọn lọc và tìm kiếm", "Chức năng nhận thức, giáo dục, dự báo và phê phán", "Chức năng tuyên truyền, phổ cập, giáo huấn và phổ quát", "Chức năng giáo dục, sàng lọc, tuyên truyền và tìm kiếm"], "ans": 1}, {"ch": 0, "num": 4, "q": "Một trong những nhiệm vụ hàng đầu khi nghiên cứu khoa học Lịch sử Đảng Cộng sản Việt Nam là:", "opts": ["Khẳng định, chứng minh giá trị khoa học của những mục tiêu chiến lược và sách lược cách mạng mà Đảng đề ra trong cương lĩnh", "Làm cho người học hiểu được quyền lực của Đảng, từ đó thêm trung thành với đường lối lãnh đạo của Đảng", "Chọn lọc ra những sự kiện lịch sử nổi bật để tái hiện lại sự thành công trong quá trình lãnh đạo của Đảng", "Tìm hiểu về lịch sử ra đời của đảng cộng sản trên thế giới"], "ans": 0}, {"ch": 0, "num": 5, "q": "Trong phương pháp nghiên cứu, học tập môn học Lịch sử Đảng Cộng sản Việt Nam cần phải dựa trên phương pháp luận khoa học mác-xít, đồng thời phải nắm vững chủ nghĩa nào dưới đây để xem xét và nhận thức lịch sử một cách khách quan, trung thực và đúng quy luật?", "opts": ["Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử", "Chủ nghĩa duy vật và chủ nghĩa duy tâm", "Chủ nghĩa duy lý và chủ nghĩa duy vật biện chứng", "Chủ nghĩa duy lý và chủ nghĩa duy vật lịch sử"], "ans": 0}, {"ch": 0, "num": 6, "q": "Tại sao khi nghiên cứu, học tập Lịch sử Đảng Cộng sản Việt Nam lại cần phải nhận thức và vận dụng chủ nghĩa duy vật lịch sử?", "opts": ["Để thấy được sự ưu việt của Đảng Cộng sản Việt Nam so với các đảng phái ở phương Tây", "Để nhận thức tiến trình cách mạng do Đảng Cộng sản Việt Nam lãnh đạo", "Để hiểu được sứ mệnh lịch sử của giai cấp nông dân trong lãnh đạo cách mạng", "Để hiểu vì sao cách mạng giải phóng dân tộc ở Việt Nam đi theo con đường tư sản"], "ans": 1}, {"ch": 0, "num": 7, "q": "Trong nghiên cứu Lịch sử Đảng Cộng sản Việt Nam, khi xem xét, đối chiếu các hiện tượng lịch sử trong hình thức tổng quát nhằm mục đích vạch ra bản chất, quy luật, khuynh hướng chung trong sự vận động của sự vật thì đó là cách nghiên cứu dựa trên:", "opts": ["Phương pháp lịch sử", "Phương pháp chọn lọc", "Phương pháp làm việc nhóm", "Phương pháp logic"], "ans": 3}, {"ch": 0, "num": 8, "q": "Cần phải coi trọng phương pháp tổng kết thực tiễn lịch sử gắn với nghiên cứu lý luận trong nghiên cứu Lịch sử Đảng Cộng sản Việt Nam để:", "opts": ["Làm rõ kinh nghiệm, bài học, quy luật phát triển của cách mạng Việt Nam", "Làm hài lòng người dân trong quá trình lãnh đạo cách mạng của Đảng", "Dễ dàng thống kê những thành tựu mà Đảng đạt được trong lãnh đạo cách mạng", "Chứng tỏ sự linh hoạt trong các bước đề ra đường lối, chủ trương của Đảng"], "ans": 0}, {"ch": 0, "num": 9, "q": "Việc tiến hành thảo luận, trao đổi các vấn đề do giảng viên đưa ra để có thể hiểu rõ hơn nội dung của môn học Lịch sử Đảng Cộng sản Việt Nam thì được gọi là:", "opts": ["Phương pháp làm việc khách quan", "Phương pháp làm việc nhóm", "Phương pháp làm việc chủ quan", "Phương pháp làm việc biện chứng"], "ans": 1}, {"ch": 0, "num": 10, "q": "Một trong những ý nghĩa của việc nghiên cứu, học tập môn học Lịch sử Đảng Cộng sản Việt Nam đối với sinh viên là:", "opts": ["Tích cực cổ vũ, tham gia vào quá trình “tự diễn biến”, “tự chuyển hoá” trong Đảng", "Giáo dục lý tưởng, truyền thống đấu tranh của Đảng, bồi đắp niềm tin vào sự lãnh đạo của Đảng", "Tin vào sự lãnh đạo của Đảng đưa đất nước tiến nhanh, mạnh, vững chắc theo con đường tư bản chủ nghĩa", "Tham gia xây dựng cải cách, cải tổ Đảng theo mô hình của Đông Âu và Liên Xô nhằm làm cho Đảng thêm vững mạnh"], "ans": 1}, {"ch": 1, "num": 1, "q": "Mâu thuẫn cơ bản của xã hội Việt Nam kể từ khi Pháp xâm lược là gì?", "opts": ["Mâu thuẫn giữa dân tộc ta với thực dân Pháp, mâu thuẫn giữa nông dân với địa chủ phong kiến", "Mâu thuẫn giữa công nhân với tư bản, mâu thuẫn giữa nông dân với địa chủ phong kiến", "Mâu thuẫn giữa nông dân với địa chủ phong kiến, mâu thuẫn giữa tư sản với vô sản", "Mâu thuẫn giữa nông dân, công nhân với địa chủ phong kiến"], "ans": 0}, {"ch": 1, "num": 2, "q": "Ở Việt Nam, giai cấp mới nào đã ra đời dưới tác động của cuộc khai thác thuộc địa lần thứ nhất (1897 - 1914) của thực dân Pháp?", "opts": ["Tư sản", "Nông dân", "Công nhân", "Tiểu tư sản"], "ans": 2}, {"ch": 1, "num": 3, "q": "Trước khi thực dân Pháp nổ súng xâm lược (1858), xã hội Việt Nam có những giai cấp cơ bản nào?", "opts": ["Địa chủ phong kiến và nông dân", "Địa chủ phong kiến và công nhân", "Công nhân và nông dân", "Nông dân và tri thức"], "ans": 0}, {"ch": 1, "num": 4, "q": "Các phong trào yêu nước ở Việt Nam trước khi có Đảng Cộng sản lãnh đạo có điểm chung là:", "opts": ["Không nhận được sự ủng hộ của người dân, đặc biệt là giai cấp công - nông", "Không thông qua ý kiến của Quốc tế Cộng sản, đặc biệt Đảng Cộng sản Liên Xô", "Không có đường lối rõ ràng dẫn đến thất bại và bị thực dân Pháp đàn áp một cách nặng nề", "Không có đủ tiềm lực tài chính và người đứng đầu lãnh đạo cách mạng"], "ans": 2}, {"ch": 1, "num": 5, "q": "Thực dân Pháp đã thực hiện chính sách gì về văn hoá xã hội để cai trị nước ta?", "opts": ["Ngu dân", "Bế quan toả cảng", "Đốt sách chôn Nho", "Chia để trị"], "ans": 0}, {"ch": 1, "num": 6, "q": "Tầng lớp tư sản mại bản của Việt Nam dưới thời Pháp thuộc có đặc điểm là:", "opts": ["Có sự tham gia vào đời sống chính trị, kinh tế của chính quyền thực dân Pháp", "Có tiềm lực kinh tế mạnh, là giai cấp đông đảo nhất trong", "Không có tư liệu sản xuất, phải bán sức lao động trong các nhà máy, xí nghiệp", "Chịu ba tầng áp bức, bóc lột: đế quốc, phong kiến và tư sản dân tộc"], "ans": 0}, {"ch": 1, "num": 7, "q": "Vì sao tầng lớp tiểu tư sản lại không thể là lực lượng lãnh đạo cách mạng chống Pháp?", "opts": ["Vì địa vị kinh tế, chính trị của họ gắn chặt với Pháp", "Vì lực lượng này hoàn toàn không có mâu thuẫn về quyền lợi với thực dân Pháp", "Vì địa vị kinh tế của họ bấp bênh, thái độ hay dao động", "Vì lực lượng này nhận được nhiều cảm tình của thực dân Pháp"], "ans": 2}, {"ch": 1, "num": 8, "q": "Cuối thế kỷ XIX - đầu thế kỷ XX, nhiệm vụ hàng đầu cần phải được giải quyết cấp thiết của cách mạng Việt Nam là:", "opts": ["Giải phóng dân tộc", "Đấu tranh giai cấp", "Canh tân đất nước", "Chia lại ruộng đất"], "ans": 0}, {"ch": 1, "num": 9, "q": "Sự kiện nào đã đánh dấu phong trào công nhân Việt Nam hoàn toàn trở thành một phong trào tự giác?", "opts": ["Năm 1920, khi tổ chức công hội ở Sài Gòn được thành lập", "Năm 1929, khi có sự ra đời của ba tổ chức cộng sản", "Năm 1930, khi Đảng Cộng sản Việt Nam ra đời", "Năm 1945, khi Cách mạng tháng Tám thành công"], "ans": 2}, {"ch": 1, "num": 10, "q": "Sự kiện nào được Nguyễn Ái Quốc đánh giá “như chim én nhỏ báo hiệu mùa xuân”?", "opts": ["Cách mạng Tháng Mười Nga bùng nổ và thắng lợi (1917)", "Sự thành lập Đảng Cộng sản Pháp (1920)", "Vụ mưu sát viên toàn quyền Méc-Lanh của Phạm Hồng Thái (1924)", "Sự ra đời của Hội Việt Nam cách mạng Thanh niên (1925)"], "ans": 2}, {"ch": 1, "num": 11, "q": "Phong trào đình công, bãi công của công nhân Việt Nam trong những năm 1926 - 1929 thuộc khuynh hướng nào?", "opts": ["Khuynh hướng phong kiến", "Khuynh hướng dân chủ tư sản", "Khuynh hướng vô sản", "Khuynh hướng dân chủ"], "ans": 2}, {"ch": 1, "num": 12, "q": "Ai là người đại diện cho chủ trương đánh đuổi thực dân Pháp giành độc lập dân tộc, khôi phục chủ quyền quốc gia bằng biện pháp bạo động?", "opts": ["Bùi Quang Chiêu", "Phan Châu Trinh", "Phan Bội Châu", "Nguyễn Ái Quốc"], "ans": 2}, {"ch": 1, "num": 13, "q": "Sự kiện nào đánh dấu bước ngoặt trong cuộc đời hoạt động cách mạng của Nguyễn Ái Quốc - từ người yêu nước trở thành người cộng sản?", "opts": ["Bỏ phiếu tán thành việc gia nhập Quốc tế III và tham gia thành lập Đảng Cộng sản Pháp", "Đọc bản Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của Lênin", "Năm 1919, gửi bản yêu sách 8 điểm đến hội nghị Véc xây", "Năm 1925, khi diễn ra cuộc bãi công ở nhà máy Ba Son"], "ans": 0}, {"ch": 1, "num": 14, "q": "Dưới tác động của chương trình khai thác thuộc địa lần thứ nhất (1897 - 1914) của thực dân Pháp, trong cơ cấu xã hội Việt Nam xuất hiện giai cấp mới nào?", "opts": ["Giai cấp tư sản", "Giai cấp công nhân", "Giai cấp tư sản và giai cấp công nhân", "Giai cấp tiểu tư sản."], "ans": 2}, {"ch": 1, "num": 15, "q": "Đảng cộng sản Việt Nam lấy nguyên tắc nào làm nguyên tắc tổ chức cơ bản?", "opts": ["Phê bình và tự phê bình", "Công khai, minh bạch", "Tập trung dân chủ", "Cần, kiệm, liêm, chính."], "ans": 2}, {"ch": 1, "num": 16, "q": "Thực dân Pháp nổ súng xâm lược Việt Nam vào năm nào?", "opts": ["1842", "1858", "1884", "1948"], "ans": 1}, {"ch": 1, "num": 17, "q": "Nội dung nào nằm trong chính sách cai trị về chính trị của thực dân Pháp?", "opts": ["Chia để trị", "Khai hóa văn minh", "Ngu dân", "Tất cả đáp án trên"], "ans": 0}, {"ch": 1, "num": 18, "q": "Nguyễn Ái Quốc gửi bản yêu sách 8 điểm tới hội nghị Vécxay vào năm nào?", "opts": ["1917", "1918", "1919", "1920"], "ans": 2}, {"ch": 1, "num": 19, "q": "Nguyễn Ái Quốc tìm thấy con đường cứu nước, giải phóng dân tộc ở văn kiện nào?", "opts": ["Tuyên ngôn độc lập Mỹ", "Tuyên ngôn nhân quyền và dân quyền Pháp", "Tuyên ngôn Đảng Cộng sản", "Bản sơ thảo lần thứ nhất luận cương về vấn đề dân tộc và vấn đề thuộc địa"], "ans": 3}, {"ch": 1, "num": 20, "q": "Cương lĩnh chính trị đầu tiên đã xác định nhiệm vụ của cách mạng Việt Nam là:", "opts": ["Đặt nhiệm vụ chống đế quốc lên hàng đầu", "Thực hiện cách mạng giải phóng dân tộc", "Thực hiện cách mạng điền địa", "Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến, làm cho nước Nam hoàn toàn độc lập"], "ans": 3}, {"ch": 1, "num": 21, "q": "Hội Liên hiệp các dân tộc thuộc địa có cơ quan ngôn luận là tờ báo nào?", "opts": ["Thanh niên", "Cờ đỏ", "Độc lập", "Người cùng khổ"], "ans": 3}, {"ch": 1, "num": 22, "q": "Nguyễn Ái Quốc đã đọc bản Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của Lênin đăng trên báo Nhân đạo vào năm:", "opts": ["1919", "1920", "1921", "1922"], "ans": 1}, {"ch": 1, "num": 23, "q": "Phong trào cách mạng Việt Nam vào cuối năm 1928, đầu năm 1929 đã hình thành làn sóng cách mạng nào dưới đây?", "opts": ["Cách mạng tư sản dân quyền", "Cách mạng dân tộc, dân chủ", "Cách mạng văn hoá", "Cách mạng tư sản"], "ans": 1}, {"ch": 1, "num": 24, "q": "Khẩu hiệu “Không thành công thì cũng thành nhân” được sử dụng trong cuộc khởi nghĩa nào dưới đây?", "opts": ["Ba ns": 0}, {"ch": 1, "num": 37, "q": "Trước tình hình các tổ chức cộng sản hoạt động biệt lập, bài xích lẫn nhau đã dẫn đến một yêu cầu bức thiết cho cách mạng Việt Nam là:", "opts": ["Giải tán các tổ chức cộng sản", "Giảng hoà sự bài xích, biệt lập giữa các tổ chức cộng sản", "Thống nhất các tổ chức cộng sản", "Kiểm điểm nghiêm túc các tổ chức cộng sản"], "ans": 2}, {"ch": 1, "num": 38, "q": "Trong Cương lĩnh chính trị đầu tiên, Đảng xác định “mục tiêu chiến lược của cách mạng Việt Nam là ……và thổ địa cách mạng để đi tới xã hội cộng sản.” Từ còn thiếu trong chỗ trống là:", "opts": ["Xã hội chủ nghĩa", "Dân quyền cách mạng", "Dân tộc dân chủ", "Dân tộc dân chủ nhân dân"], "ans": 1}, {"ch": 1, "num": 39, "q": "Cương lĩnh chính trị đầu tiên của Đảng được thông qua tại Hội nghị thành lập Đảng Cộng sản Việt Nam ngày 3/2/1930 đã xác định giai cấp nào là lực lượng lãnh đạo cách mạng?", "opts": ["Giai cấp tư sản", "Giai cấp công nhân", "Giai cấp nông dân", "Giai cấp địa chủ"], "ans": 1}, {"ch": 1, "num": 40, "q": "Sự kiện nào được Nguyễn Ái Quốc đánh giá “giai cấp vô sản ta đã trưởng thành và đủ sức lãnh đạo cách mạng”?", "opts": ["Hội nghị Thành lập Đảng Cộng sản Việt Nam (1930)", "Chi bộ Cộng sản đầu tiên của Việt Nam ra đời (1929)", "Thành lập tổ chức Công hội đỏ Bắc Kỳ (1929)", "Sự ra đời của ba tổ chức Cộng sản (1929)"], "ans": 0}, {"ch": 1, "num": 41, "q": "Hai văn kiện nào dưới đây được coi như là Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam?", "opts": ["Chánh cương vắn tắt và Lời kêu gọi của Đảng", "Sách lược vắn tắt và Lời kêu gọi của Đảng", "Chánh cương vắn tắt và Sách lược vắn tắt của Đảng", "Sách lược vắn tắt và Chương trình tóm tắt của Đảng"], "ans": 2}, {"ch": 1, "num": 42, "q": "Nội dung nào sau đây nằm trong Cương lĩnh chính trị đầu tiên của Đảng?", "opts": ["Đánh đổ đế quốc Pháp và phong kiến, làm cho nước Nam hoàn toàn độc lập", "Tư sản dân quyền cách mạng là thời kỳ dự bị để làm xã hội cách mạng", "Chỉ có giải phóng giai cấp vô sản thì mới giải ịch thu ruộng đất của địa chủ phong kiến chia cho dân cày", "Chống phát-xít, chống chiến tranh đế quốc, chống bọn phản động thuộc địa, đòi tự do, dân chủ, cơm áo hòa bình", "Đàm phán thông qua ngoại giao với thực dân Pháp để giành lại độc lập dân tộc"], "ans": 2}, {"ch": 1, "num": 49, "q": "Hình thức đấu tranh mới xuất hiện trong phong trào dân chủ 1936 - 1939 ở Việt Nam là:", "opts": ["Mít-tinh biểu tình", "Đấu tranh nghị trường", "Đấu tranh chính trị", "Bãi khoá, bãi công"], "ans": 1}, {"ch": 1, "num": 50, "q": "Chủ trương và nhận thức mới của Đảng trong những năm 1936 - 1939 đã xác định kẻ thù nguy hại trước mắt của nhân dân Đông Dương là:", "opts": ["Chủ nghĩa phát-xít và phong kiến tay sai", "Chủ nghĩa đế quốc và phong kiến", "Phong kiến và tư sản mại bản", "Phản động thuộc địa và bè lũ tay sai"], "ans": 3}, {"ch": 1, "num": 52, "q": "Một trong những ý nghĩa của phong trào vận động dân chủ 1936 - 1939 là:", "opts": ["Thực dân Pháp phải chấp nhận tất cả những yêu sách dân chủ", "Giúp cán bộ, đảng viên của Đảng được rèn luyện và trưởng thành", "Thực dân Pháp rút quân ra khỏi lãnh thổ Việt Nam", "Đưa các cán bộ của Đảng gia nhập vào Nghị trường Pháp"], "ans": 1}, {"ch": 1, "num": 53, "q": "Tháng 3/1938, Đảng quyết định thành lập tổ chức nào để tập hợp rộng rãi lực lượng đông đảo nhân dân chống phát-xít và tay sai phản động?", "opts": ["Mặt trận Liên Việt", "Mặt trận Thống nhất Dân tộc phản đế Đông Dương", "Mặt trận Nhân dân phản đế Đông Dương", "Mặt trận Dân chủ Đông Dương"], "ans": 3}, {"ch": 1, "num": 54, "q": "Đâu được coi là cuộc diễn tập lần thứ hai chuẩn bị cho Cách mạng Tháng Tám năm 1945 ở Việt Nam?", "opts": ["Phong trào cách mạng 1930 - 1931", "Cuộc vận động dân chủ 1936 - 1939", "Cuộc vận động giải phóng dân tộc 1939 - 1945", "Cao trào kháng Nhật cứu nước"], "ans": 1}, {"ch": 1, "num": 55, "q": "Từ việc theo dõi diễn biến của cuộc Chiến tranh Thế giới thứ hai và căn cứ vào tình hình trong nước, Ban Chấp hành Trung ương Đảng xác định nhiệm vụ trung tâm cách mạng Việt Nam trong giai đoạn 1939 - 1945 là:", "opts": ["Chuẩn bị khởi nghĩa vũ trang", "Giành lại ruộng đất cho dân cày nghèo", "Phá kho thóc Nhật để cứu đói", "Thành lập Mặt trận Việt Minh"], "ans": 0}, {"ch": 1, "num": 56, "q": "Trong giai đoạn 1939 - 1945, nhiệm vụ của cách mạng Việt Nam được Đảng ta đưa lên hàng đầu là gì?", "opts": ["Đòi quyền dân chủ", "Giải phóng dân tộc", "Đánh đổ phong kiến", "Đánh đổ tư sản"], "ans": 1}, {"ch": 1, "num": 57, "q": "Khi Chiến tranh Thế giới Thứ hai bùng nổ, Đảng đã tiến hành hoạt động gì để thích ứng với tình hình mới?", "opts": ["Tuyên bố tự giải tán, chỉ để lại một bộ phận rất nhỏ hoạt động ngầm ở các thành phố", "Hợp tác với quân đội Pháp để đảo chính Nhật", "Rút vào hoạt động bí mật, chuyển trọng tâm công tác về nông thôn", "Tăng cường các hoạt động chống phát-xít ở các thành phố lớn"], "ans": 2}, {"ch": 1, "num": 58, "q": "Khi chiến tranh Thế giới Thứ hai bùng nổ, thực dân Pháp đã thi hành chính sách gì ở Việt Nam?", "opts": ["Kinh tế thời chiến", "Kinh tế thuộc địa thời chiến", "Kinh tế chỉ huy", "Kinh tế hàng hoá"], "ans": 2}, {"ch": 1, "num": 59, "q": "Chính sách nào của Nhật - Pháp đã gây ra nạn đói lớn ở Việt Nam cuối năm 1944 - đầu năm 1945?", "opts": ["Xuất khẩu các nguyên liệu chiến lược sang Nhật Bản", "Bắt người dân nhổ lúa, trồng đay lấy nguyên liệu phục vụ chiến tranh", "Đầu tư vào những ngành công nghiệp phục vụ quân sự", "Kiểm soát toàn bộ hệ thống đường sá"], "ans": 1}, {"ch": 1, "num": 60, "q": "Điền từ còn thiếu vào chỗ trống về nhận định của Đảng ta tại Hội nghị Trung ương 5/1941: “Cuộc cách mạng Đông Dương trong giai đoạn hiện tại là một cuộc cách mạng ……”", "opts": ["Tư sản dân quyền", "Dân chủ tư sản", "Xã hội chủ nghĩa", "Dân tộc giải phóng"], "ans": 3}, {"ch": 1, "num": 61, "q": "Nguyễn Ái Quốc về nước trực tiếp lãnh đạo cách mạng Việt Nam vào năm nào?", "opts": ["1930", "1935", "1941", "1945"], "ans": 2}, {"ch": 1, "num": 62, "q": "Tại Hội Nghị Trung ương Đảng lần thứ VIII (5/1941), Nguyễn n Bái (1927)", "Binh biến Đô Lương (1941)"], "ans": 1}, {"ch": 1, "num": 71, "q": "Sự kiện nào dưới đây đã tạo ra thời cơ thuận lợi cho nhân dân ta giành lại độc lập vào tháng 8/1945?", "opts": ["Sự thất bại của phe phát-xít tại chiến trường châu Mỹ", "Sự thất bại của Hồng quân Liên Xô tại mặt trận Xô-Đức", "Sự nổi dậy giành thắng lợi của nhân dân các nước Tây Âu", "Sự đầu hàng vô điều kiện của phát-xít Nhật"], "ans": 3}, {"ch": 1, "num": 72, "q": "Ở Châu Á, quân phiệt Nhật đã đầu hàng Đồng minh vô điều kiện vào năm nào?", "opts": ["1940", "1942", "1945", "1950"], "ans": 2}, {"ch": 1, "num": 73, "q": "Nhật nổ súng đảo chính pháp ngày:", "opts": ["8/3/1945", "9/3/1945", "26/3/1945", "19/12/1946"], "ans": 1}, {"ch": 1, "num": 74, "q": "Chỉ thị “Nhật – Pháp bắn nhau và hành động của chúng ta” đề ra vào ngày tháng năm nào?", "opts": ["9/03/1945", "10/03/1945", "11/03/1945", "12/03/1945"], "ans": 3}, {"ch": 1, "num": 75, "q": "Để làm tiền đề cho cuộc Tổng khởi nghĩa Tháng 8/1945, chỉ thị “Nhật - Pháp bắn nhau và hành động của chúng ta” đã đề ra chủ trương nào dưới đây?", "opts": ["Phát động tổng khởi nghĩa", "Phát động khởi nghĩa từng phần", "Phát động cao trào kháng Nhật cứu nước", "Phát động phong trào kháng chiến kiến quốc"], "ans": 2}, {"ch": 1, "num": 76, "q": "Hội nghị toàn quốc của Đảng (từ 14 đến 15/8/1945) đã xác định nguyên tắc để chỉ đạo khởi nghĩa là:", "opts": ["Riêng lẻ, từng phần", "Chia từng giai đoạn nhỏ", "Tận dụng thời cơ mỗi giai đoạn", "Tập trung, thống nhất và kịp thời"], "ans": 3}, {"ch": 1, "num": 77, "q": "Đại hội Quốc dân họp tại Tân Trào (16/8/1945) của Đảng đã quyết định những vấn đề gì?", "opts": ["Tán thành chủ trương Tổng khởi nghĩa của Đảng, quyết định đặt tên nước Việt Nam Dân chủ Cộng hòa", "Thành lập mặt trận Việt Minh để chuẩn bị lực lượng vũ trang cho Tổng khởi nghĩa", "Quyết định phương châm chiến lược cho Tổng khởi nghĩa là “táo bạo, bất ngờ, chắc thắng”", "Bầu ra các chức vụ trong Đảng sau khi Tổng khởi nghĩa giành thắng lợi"], "ans": 0}, {"ch": 1, "num": 78, "q": "Đảng đã xác định thời cơ “ngàn năm có một” của Cách mạng Tháng Tám năm 1945 tồn tại trong khoảng thời gian nào?", "opts": ["Từ sau khi Nhật đầu hàng Đồng minh đến khi quân Đồng minh vào Đông Dương", "Từ sau khi quân Đồng minh vào Đông Dương đến trước khi quân Nhật đầu hàng Đồng minh", "Từ sau khi Nhật đầu hàng Đồng minh đến trước khi quân Đồng minh vào Đông Dương", "Từ trước khi Nhật đầu hàng Đồng minh đến sau khi quân Đồng minh vào Đông Dương"], "ans": 2}, {"ch": 1, "num": 79, "q": "Ngày 16/8/1945, Đại hội quốc dân họp tại Tân Trào (Tuyên Quang) đã quyết định thành lập tổ chức thực hiện nhiệm vụ của một Chính phủ lâm thời. Đó là tổ chức nào?", "opts": ["Ủy ban khởi nghĩa toàn quốc", "Đảng Cộng sản Đông Dương", "Ủy ban dân tộc Giải phóng Việt Nam", "Mặt trận Việt Minh"], "ans": 2}, {"ch": 1, "num": 80, "q": "Cách mạng giành chính quyền ở Hà Nội trong Cách mạng Tháng Tám nổ ra vào thời gian nào?", "opts": ["18/8/1945", "19/8/1945", "23/8/1945", "25/8/1945"], "ans": 1}, {"ch": 1, "num": 81, "q": "Phương pháp đấu tranh cơ bản trong Cách mạng Tháng Tám năm 1945 là:", "opts": ["Đấu tranh chính trị kết hợp với đấu tranh báo chí", "Đấu tranh vũ trang kết hợp với đấu tranh ngoại giao", "Đấu tranh chính trị kết hợp với đấu tranh vũ trang", "Đấu tranh chính trị kết hợp với đấu tranh nghị trường"], "ans": 2}, {"ch": 1, "num": 82, "q": "Trong các bài học kinh nghiệm được rút ra từ Cách mạng Tháng Tám năm 1945, bài học nào có ý nghĩa hàng đầu trong đường lối cách mạng của Đảng?", "opts": ["Lợi dụng mâu thuẫn trong hàng ngũ kẻ thù", "Nắm vững nghệ thuật khởi nghĩa, chọn đúng kẻ thù của cách mạng", "Toàn dân nổi dậy trên nền tảng khối liên minh công - nông", "Giương cao ngọn cờ độc lập dân tộc, kết hợp đúng đắn hai nhiệm vụ chống đế quốc và chống phong kiến"], "ans": 3}, {"ch": 1, "num": 83, "q": "Tính chất của cuộc Cách mạng Tháng Tám năm 1945 là:", "opts": ["Cuộc cách mạng giải phóng giai cấp", "Cuộc cách mạng giải phóng dân tộc", "Cuộc cách mạ gành công - nông nghiệp đang phát triển"], "ans": 2}, {"ch": 2, "num": 6, "q": "Điền vào chỗ trống: “Nhà nước Việt Nam Dân chủ Cộng hoà được thành lập năm 1945 là nhà nước…đầu tiên ở Đông Nam Á”", "opts": ["Công nông", "Phong kiến", "Tư sản", "Cộng sản"], "ans": 0}, {"ch": 2, "num": 7, "q": "Ý nào dưới đây không phải là biện pháp giải quyết nạn đói do Chính phủ đề ra?", "opts": ["Bãi bỏ thuế thân và các thứ thuế vô lý khác", "Thu mua lương thực từ nước ngoài", "Thực hiện chính sách giảm tô 25%", "Đẩy mạnh tăng gia sản xuất"], "ans": 1}, {"ch": 2, "num": 8, "q": "Chính phủ nước Việt Nam Dân chủ Cộng hoà làm gì để khẳng định quyền về kinh tế - tài chính?", "opts": ["Phát hành đồng giấy bạc Việt Nam", "Tịch thu gia sản của đế quốc, Việt gian", "Kêu gọi đóng góp từ quần chúng nhân dân", "Thu thuế nông nghiệp theo biểu thuế thời Pháp thuộc"], "ans": 0}, {"ch": 2, "num": 9, "q": "Điền từ còn thiếu vào chỗ trống: “Một dân tộc dốt là một dân tộc ……Vì vậy tôi đề nghị mở một chiến dịch chống nạn mù chữ.” (Trích phát biểu của Chủ tịch Hồ Chí Minh tại buổi họp đầu tiên của Hội đồng Chính phủ ngày 3/9/1945)", "opts": ["Đói", "Kém", "Yếu", "Hèn"], "ans": 2}, {"ch": 2, "num": 10, "q": "Để diệt giặc dốt, Chủ tịch Hồ Chí Minh đã ký sắc lệnh thông qua việc thành lập tổ chức nào dưới đây?", "opts": ["Bộ Quốc gia Giáo dục", "Hiệp hội Giáo dục Ngoài công lập Việt Nam", "Tổ chức tình nguyện vì giáo dục", "Nha Bình dân học vụ"], "ans": 3}, {"ch": 2, "num": 11, "q": "Nha Bình dân học vụ được thành lập vào năm nào?", "opts": ["1945", "1955", "1965", "1975"], "ans": 0}, {"ch": 2, "num": 12, "q": "Điền vào chỗ trống từ còn thiếu để hoàn thành câu nói sau của Chủ tịch Hồ Chí Minh: “Ngày nay chúng ta đã xây dựng nên nước Việt Nam Dân chủ Cộng hoà. Nhưng nếu nước độc lập mà dân không được hưởng ……thì độc lập cũng chẳng có ý nghĩa gì.” (Trích Thư gửi Uỷ ban nhân dân các kỳ, tỉnh, huyện và làng ngày 17/10/1945)", "opts": ["Hạnh phúc, công bằng", "Cơm ăn, áo mặc", "Hạnh phúc, tự do", "Ruộng đất, ấm no"], "ans": 2}, {"ch": 2, "num": 13, "q": "Chỉ thị “Kháng chiến kiến quốc” được Đảng ta đưa ra vào thời gian nào?", "opts": ["23/11/1945", "25/11/1945", "27/11/1945", "29/11/1945"], "ans": 1}, {"ch": 2, "num": 14, "q": "Tính đến cuối năm 1946, nước ta có khoảng bao nhiêu người biết đọc, biết viết chữ Quốc ngữ?", "opts": ["Hơn 1 triệu người", "Hơn 1,5 triệu người", "Hơn 2 triệu người", "Hơn 2,5 triệu người"], "ans": 3}, {"ch": 2, "num": 15, "q": "Hoạt động nào dưới đây được Chủ tịch Hồ Chí Minh đặc biệt coi trọng, thể hiện tính ưu việt của chế độ mới, góp phần tích cực xây dựng hệ thống chính quyền cách mạng, phát huy quyền làm chủ của nhân dân?", "opts": ["Chống giặc dốt, xoá nạn mù chữ", "Trồng cây gây rừng", "Khai hoang làm kinh tế mới", "Cải cách ruộng đất"], "ans": 0}, {"ch": 2, "num": 16, "q": "Sau Cách mạng Tháng Tám, Đảng và Chính phủ lâm thời đã phát động toàn dân xây dựng nếp sống văn hóa mới nhằm:", "opts": ["Phát triển đất nước theo văn minh phương Tây", "Hội nhập văn hoá quốc tế", "Nâng cao tinh thần chống giặc trong tầng lớp thanh niên", "Đẩy lùi các tệ nạn, hủ tục, thói quen cũ, lạc hậu cản trở tiến bộ"], "ans": 3}, {"ch": 2, "num": 17, "q": "Điền từ còn thiếu vào chỗ trống để hoàn thành câu nói sau đây của Chủ tịch Hồ Chí Minh: “Các cơ quan của Chính phủ từ toàn quốc đến các làng, đều là …… của dân, nghĩa là để gánh việc chung cho dân, chứ không phải đè đầu dân như trong thời kỳ dưới quyền thống trị của Pháp, Nhật.” (Trích Thư gửi Uỷ ban nhân dân các kỳ, tỉnh, huyện và làng 17/10/1945)", "opts": ["Công bộc", "Bạn hữu", "Đồng minh", "Giúp việc"], "ans": 0}, {"ch": 2, "num": 18, "q": "Hội nghị toàn xứ Đảng bộ Nam Kỳ (ngày 25/10/1945) được tổ chức tại đâu?", "opts": ["Dinh Độc lập (Sài Gòn)", "Cái Bè (Mỹ Tho)", "Năm Căn (Cà Mau)", "Rạch Giá (Kiên Giang)"], "ans": 1}, {"ch": 2, "num": 19, "q": "Hội nghị toàn xứ Đảng bộ Nam Kỳ (ngày 25/10/1945) đã quyết định:", "opts": ["Đưa cách mạng Việt Nam rút lui vào hoạt động bí mật", "Tạm thời giải tán các tổ chức m lược Campuchia", "Quân xâm lược Lào"], "ans": 0}, {"ch": 3, "num": 10, "q": "Hội nghị Bộ Chính trị khoá V (8/1986) đã nhận định đặc trưng của thời kỳ quá độ lên chủ nghĩa xã hội ở nước ta là:", "opts": ["Nền kinh tế có cơ cấu nhiều thành phần", "Nền kinh tế chủ yếu dựa vào các doanh nghiệp nhà nước", "Nền kinh tế lấy tự cung, tự cấp làm nền tảng", "Nền kinh tế sản xuất hàng hoá nhỏ nên được loại bỏ"], "ans": 0}, {"ch": 3, "num": 11, "q": "Điền từ còn thiếu vào chỗ trống: “Trong hệ thống chính trị, Đảng Cộng sản là một bộ phận và là tổ chức lãnh đạo hệ thống đó, lấy Chủ nghĩa Mác - Lênin và Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động, lấy ______ làm nguyên tắc tổ chức cơ bản.”", "type": "fill", "blank": "TẬP TRUNG DÂN CHỦ"}, {"ch": 3, "num": 12, "q": "Điền từ thích hợp vào chỗ trống: “ ______ là tổ chức liên minh chính trị, tổ chức xã hội và các cá nhân tiêu biểu trong các giai cấp, tầng lớp xã hội, các dân tộc, các tôn giáo và người Việt Nam định cư ở nước ngoài, là một bộ phận của hệ thống chính trị, là cơ sở chính trị của chính quyền nhân dân.”", "type": "fill", "blank": "MẶT TRẬN TỔ QUỐC VIỆT NAM"}, {"ch": 3, "num": 13, "q": "Điền vào chỗ trống: “Hội nghị Trung ương 7 (3/2003) đã thống nhất nhận thức coi ______ là tài nguyên quốc gia vô cùng quý giá, là tư liệu sản xuất đặc biệt, là nguồn nội lực và nguồn vốn to lớn của đất nước”.", "type": "fill", "blank": "ĐẤT ĐAI"}, {"ch": 3, "num": 14, "q": "Đại hội IV của Đảng đã xác định đường lối chung của cách mạng xã hội chủ nghĩa trong giai đoạn mới là: “Nắm vững ______, phát huy quyền làm chủ của nhân dân và tiến hành đồng thời ba cuộc cách mạng: cách mạng về quan hệ sản xuất, cách mạng khoa học - kỹ thuật và cách mạng tư tưởng, văn hoá", "type": "fill", "blank": "CHUYÊN CHÍNH VÔ SẢN"}, {"ch": 3, "num": 15, "q": "Điền từ thích hợp vào chỗ trống: Đại hội V của Đảng (1982) đã xác định nội dung, bước đi, cách làm thực hiện công nghiệp hoá xã hội chủ nghĩa trong chặng đường đầu tiên là: “Tập trung phát triển mạnh ______, coi ______ là mặt trận hàng đầu, đưa ______ một bước lên sản xuất lớn xã hội chủ nghĩa, ra sức đẩy mạnh phát triển hàng tiêu dùng và hàng xuất khẩu.”", "type": "fill", "blank": "NÔNG NGHIỆP"}, {"ch": 3, "num": 16, "q": "Điền từ thích hợp vào chỗ trống: Đại hội VI của Đảng đã nhìn thẳng vào ______, đánh giá đúng ______, nói rõ ______, đánh giá thành tựu, nghiêm túc kiểm điểm, chỉ rõ những sai lầm, khuyết điểm của Đảng trong thời kì 1975 - 1986", "type": "fill", "blank": "SỰ THẬT"}, {"ch": 3, "num": 17, "q": "Trong cuộc tiến công chiến lược mùa khô 1966 - 1967, Mỹ đã tiến hành bao nhiêu cuộc hành quân chiến lược?", "opts": ["120 cuộc hành quân", "500 cuộc hành quân", "895 cuộc hành quân", "700 cuộc hành quân"], "ans": 2}, {"ch": 3, "num": 18, "q": "Tổng kết thời kỳ 10 năm (1976 - 1986), thành tựu nổi bật cách mạng Việt Nam đã đạt được là:", "opts": ["Nền kinh tế có bước phát triển vượt bậc, đời sống người dân ngày càng được cải thiện", "Đưa tỉ lệ lạm phát thấp xuống mức kỷ lục", "Đạt được những thắng lợi to lớn trong sự nghiệp bảo vệ Tổ quốc và làm nghĩa vụ quốc tế", "Có mối quan hệ ngoại giao với hầu hết các quốc gia trên thế giới"], "ans": 2}, {"ch": 3, "num": 19, "q": "Chủ đề của Đại hội X của Đảng (2006) là: “Nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng, phát huy sức mạnh toàn dân tộc, đẩy mạnh toàn diện công cuộc đổi mới, sớm đưa nước ta ra khỏi tình trạng ______ ” . Từ còn thiếu trong chỗ trống là:", "type": "fill", "blank": "KÉM PHÁT TRIỂN"}, {"ch": 3, "num": 20, "q": "Việt Nam cần khai thác lợi thế của quốc gia đi sau để thực hiện thành công công nghiệp hóa, hiện đại hóa. Chúng ta phải tận dụng lợi thế nào để đẩy nhanh tốc độ phát triển và hội nhập?", "opts": ["Cuộc cách mạng công nghiệp lần thứ tư", "Sự phát triển như vũ bão của khoa học, công nghệ", "Nền sản xuất hiện đại", "Nền công nghiệp phát triển"], "ans": 1}, {"ch": 3, "num": 21, "q": "Đại hội IX của Đảng đã đề ra Chiến lược phát triển kinh tế - xã hội 10 năm tiếp the   h+=`<div class="msg" id="msg"></div><div id="nx"></div><div class="hint">Phím tắt: 1-4 hoặc A-D để chọn, Enter để sang câu tiếp.</div>`;
  app.innerHTML=h;
  const inp=document.getElementById('inp');if(inp)inp.focus();
}
function result(ok,ansText){
  answered=true;const q=list[idx];
  if(ok)right++;else wrong.push(q);
  document.getElementById('cnt').textContent=`Câu ${idx+1}/${list.length} · Đúng ${right} · Sai ${wrong.length}`;
  document.getElementById('msg').innerHTML=ok?'<span style="color:#2a2">✔ ĐÚNG</span>':`<span style="color:#c22">✘ SAI</span> — Đáp án đúng: ${esc(ansText)}`;
  document.getElementById('nx').innerHTML='<button id="nb" onclick="next()">Câu tiếp →</button>';
  document.getElementById('nb').focus();
}
function pick(k){
  if(answered)return;const q=list[idx];const corr=curOrder.indexOf(q.ans);
  curOrder.forEach((_,j)=>document.getElementById('o'+j).disabled=true);
  document.getElementById('o'+corr).classList.add('ok');
  if(k!=corr)document.getElementById('o'+k).classList.add('bad');
  result(k==corr,'ABCD'[corr]+'. '+q.opts[q.ans]);
}
function checkFill(){
  if(answered)return;const q=list[idx];const inp=document.getElementById('inp');
  const ok=norm(inp.value)==norm(q.blank);inp.disabled=true;inp.classList.add(ok?'ok':'bad');
  result(ok,q.blank);
}
function next(){idx++;show()}
function done(){
  let h=`<h2>Xong!</h2><p>Đúng <b>${right}/${list.length}</b> câu (${Math.round(right*100/list.length)}%).</p>`;
  if(wrong.length)h+=`<button onclick="start(curCh,wrongList)">Làm lại ${wrong.length} câu sai</button> `;
  h+=`<button onclick="start(curCh,lastList)">Làm lại (xáo mới)</button> <button onclick="home()">Về trang đầu</button>`;
  window.wrongList=wrong.slice();window.lastList=list;
  app.innerHTML=h;
}
document.addEventListener('keydown',e=>{
  if(!list.length||idx>=list.length||!app.querySelector('.q'))return;
  const q=list[idx];
  if(e.key=='Enter'){ if(answered){e.preventDefault();next()} else if(q.type=='fill'){e.preventDefault();checkFill()} return;}
  if(q.type=='fill'||answered)return;
  const m={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()];
  if(m!==undefined&&m<q.opts.length)pick(m);
});
home();
</script></body></html>
